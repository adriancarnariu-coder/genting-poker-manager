# Review-only migration. The build guard prevents automatic production/preview publication.
[build]
  base = "."
  command = "npm run build:netlify"
  publish = "private-publish"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["dist/**", "auth/login.html", "auth/login.css", "auth/client.js", "docs/version49-manifest.json"]

# The guard remains mandatory. App assets are function-only; never publish dist directly.
